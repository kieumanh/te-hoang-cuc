<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#173e35" />
    <title>Tê Hoàng Cục · Kỳ viện</title>
    <meta
      name="description"
      content="Kỳ viện gia đình cho người yêu cờ vây, cờ tướng và cờ vua. Giao đấu, học kỳ nghệ và lưu lại từng ván cờ."
    />
    <link rel="icon" href="/art/logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <a class="skip" href="#main">Đến nội dung</a>
    <header>
      <div class="shell top">
        <a class="brand" href="#home"
          ><img src="/art/logo.svg" alt="" /><span>Tê Hoàng Cục</span></a
        >
        <nav id="nav"></nav>
        <button class="account" id="account"></button>
      </div>
    </header>
    <main class="shell" id="main" tabindex="-1"></main>
    <footer>
      <div class="shell">
        <span>Tê Hoàng Cục <small>v1.0</small></span
        ><button data-act="brand">Bộ nhận diện</button>
      </div>
    </footer>
    <dialog id="modal">
      <div id="dialogbody"></div>
      <button id="close" class="x" aria-label="Đóng">×</button>
    </dialog>
    <div id="toast" role="status"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
